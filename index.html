<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Daily</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }
    .header {
      background: #2d6a4f;
      color: #fff;
      text-align: center;
      padding: 20px 16px 14px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .header .date {
      font-size: 0.95rem;
      margin-top: 4px;
      opacity: 0.85;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: #40916c;
      color: #fff;
      padding: 10px 8px;
      font-size: 0.9rem;
      text-align: center;
    }
    thead th:first-child { text-align: left; padding-left: 16px; }
    tbody tr:nth-child(even) { background: #f6faf7; }
    tbody tr:hover { background: #e8f5e9; }
    tbody td {
      padding: 8px;
      text-align: center;
      font-size: 0.95rem;
      border-bottom: 1px solid #e0e0e0;
    }
    tbody td:first-child {
      text-align: left;
      padding-left: 16px;
      font-weight: 600;
      color: #1b4332;
    }
    tbody td input[type="number"] {
      width: 70px;
      padding: 5px 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      color: #333;
    }
    tbody td input[type="number"]:focus {
      outline: none;
      border-color: #40916c;
      box-shadow: 0 0 0 2px rgba(64,145,108,0.2);
    }
    .result {
      background: #d8f3dc;
      color: #1b4332;
      font-weight: 700;
      font-size: 1rem;
      min-width: 60px;
      display: inline-block;
      border-radius: 6px;
      padding: 4px 10px;
    }
    .note-section {
      padding: 16px;
      border-top: 2px solid #e0e0e0;
    }
    .note-section label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .note-section textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
      color: #333;
    }
    .note-section textarea:focus {
      outline: none;
      border-color: #40916c;
      box-shadow: 0 0 0 2px rgba(64,145,108,0.2);
    }
    .btn-row {
      padding: 14px 16px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-send {
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-send:hover { background: #1b4332; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 Stock Daily</h1>
    <div class="date" id="dateDisplay"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>รายการ</th>
        <th>ของเดิม</th>
        <th>ของเข้า</th>
        <th>ตัดแต่ง</th>
        <th>เหลือ</th>
      </tr>
    </thead>
    <tbody id="stockBody">
    </tbody>
  </table>

  <div class="note-section">
    <label>📝 หมายเหตุ</label>
    <textarea id="noteInput" placeholder="กรอกรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
  </div>

  <div class="btn-row">
    <button class="btn-send" onclick="sendData()">ส่งข้อมูล</button>
  </div>
</div>

<script>
  const items = [
    'Salmon', 'Maguro', 'Madai', 'ShimaAji', 'Kanpachi',
    'Aori Ika', 'Hokkigai', 'Ikura', 'Hotate'
  ];

  // แสดงวันที่ภาษาไทย
  function getThaiDate() {
    const now = new Date();
    const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const day = days[now.getDay()];
    const date = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear() + 543;
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    return `วัน${day}ที่ ${date} ${month} ${year}  ${hh}:${mm}:${ss}`;
  }
  document.getElementById('dateDisplay').textContent = getThaiDate();
  setInterval(() => {
    document.getElementById('dateDisplay').textContent = getThaiDate();
  }, 1000);

  // สร้างแถวตาราง
  const tbody = document.getElementById('stockBody');
  items.forEach((item, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item}</td>
      <td><input type="number" id="old_${i}" value="0" min="0"></td>
      <td><input type="number" id="in_${i}" value="0" min="0"></td>
      <td><input type="number" id="cut_${i}" value="0" min="0"></td>
      <td><input type="number" id="rem_${i}" value="0" min="0" style="background:#d8f3dc; font-weight:700; color:#1b4332;"></td>
    `;
    tbody.appendChild(tr);
  });

  // ส่งข้อมูล
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbztH-6_xzmIoUL9cIarYURhmk7svO5XufJ4olrka0lqUekCPJUmhMLbcSbHaJsvPopQwA/exec';

  function sendData() {
    const rows = items.map((item, i) => ({
      item,
      old: document.getElementById(`old_${i}`).value,
      in: document.getElementById(`in_${i}`).value,
      cut: document.getElementById(`cut_${i}`).value,
      rem: document.getElementById(`rem_${i}`).value,
    }));
    const note = document.getElementById('noteInput').value;
    const date = document.getElementById('dateDisplay').textContent;

    const btn = document.querySelector('.btn-send');
    btn.disabled = true;
    btn.textContent = 'กรละส่ง...';

    fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, rows, note })
    })
    .then(() => {
      alert('ส่งข้อมูต่นทร์! b\nมิดเรียบร้อยแล้วรลฯ Google Sheet แร์รับเงินร์');
      btn.disabled = false;
      btn.textContent = 'ส่งข้อมูล';
    })
    .catch(err => {
      alert('เขทรนะรุจ \n' + err.message);
      btn.disabled = false;
      btn.textContent = 'ส่งข้อมูล';
    });
  }
</pcript>
</body>
</html>

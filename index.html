<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Daily</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f4f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }
    .header {
      background: #2d6a4f;
      color: #fff;
      text-align: center;
      padding: 20px 16px 14px;
    }
    .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; }
    .header .date { font-size: 0.95rem; margin-top: 4px; opacity: 0.85; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #40916c;
      color: #fff;
      padding: 10px 8px;
      font-size: 0.9rem;
      text-align: center;
    }
    thead th:first-child { text-align: left; padding-left: 16px; }
    tbody tr:nth-child(even) { background: #f6faf7; }
    tbody tr:hover { background: #e8f5e9; }
    tbody td {
      padding: 8px;
      text-align: center;
      font-size: 0.95rem;
      border-bottom: 1px solid #e0e0e0;
    }
    tbody td:first-child {
      text-align: left;
      padding-left: 16px;
      font-weight: 600;
      color: #1b4332;
    }
    tbody td input[type="number"] {
      width: 70px;
      padding: 5px 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      color: #333;
    }
    tbody td input[type="number"]:focus {
      outline: none;
      border-color: #40916c;
      box-shadow: 0 0 0 2px rgba(64,145,108,0.2);
    }
    .note-section { padding: 16px; border-top: 2px solid #e0e0e0; }
    .note-section label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .note-section textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
      color: #333;
    }
    .note-section textarea:focus {
      outline: none;
      border-color: #40916c;
      box-shadow: 0 0 0 2px rgba(64,145,108,0.2);
    }
    .btn-row { padding: 14px 16px; display: flex; justify-content: flex-end; }
    .btn-send {
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-send:hover { background: #1b4332; }
  </style>
</head>
<body>
<div class="container" id="captureArea">
  <div class="header">
    <h1>&#128203; Stock Daily</h1>
    <div class="date" id="dateDisplay"></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>&#3619;&#3634;&#3618;&#3585;&#3634;&#3619;</th>
        <th>&#3586;&#3629;&#3591;&#3648;&#3604;&#3636;&#3617;</th>
        <th>&#3586;&#3629;&#3591;&#3648;&#3586;&#3657;&#3634;</th>
        <th>&#3605;&#3633;&#3604;&#3649;&#3605;&#3656;&#3591;</th>
        <th>&#3648;&#3627;&#3621;&#3639;&#3629;</th>
      </tr>
    </thead>
    <tbody id="stockBody"></tbody>
  </table>
  <div class="note-section">
    <label>&#128221; &#3627;&#3617;&#3634;&#3618;&#3648;&#3627;&#3605;&#3640;</label>
    <textarea id="noteInput" placeholder="&#3585;&#3619;&#3629;&#3585;&#3634;&#3621;&#3632;&#3648;&#3629;&#3637;&#3618;&#3604;&#3656;&#3617;&#3648;&#3617; (&#3606;&#3657;&#3634;&#3617;&#3637;)"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn-send" onclick="sendData()">&#3626;&#3656;&#3591;&#3586;&#3657;&#3629;&#3617;&#3641;&#3621;</button>
  </div>
</div>

<script>
  var items = [
    'Salmon', 'Maguro', 'Madai', 'ShimaAji', 'Kanpachi',
    'Aori Ika', 'Hokkigai', 'Ikura', 'Hotate'
  ];

  function getThaiDate() {
    var now = new Date();
    var days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    var months = ['มกราคม','กุกภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุษาคม','พฤศจิกายน','ธันวาคม'];
    var day = days[now.getDay()];
    var date = now.getDate();
    var month = months[now.getMonth()];
    var year = now.getFullYear() + 543;
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    var ss = String(now.getSeconds()).padStart(2,'0');
    return 'wan' + day + 'ที่ ' + date + ' ' + month + ' ' + year + '  ' + hh + ':' + mm + ':' + ss;
  }
  document.getElementById('dateDisplay').textContent = getThaiDate();
  setInterval(function() {
    document.getElementById('dateDisplay').textContent = getThaiDate();
  }, 1000);

  var tbody = document.getElementById('stockBody');
  items.forEach(function(item, i) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + item + '</td>' +
      '<td><input type="number" id="old_' + i + '" value="0" min="0"></td>' +
      '<td><input type="number" id="in_' + i + '" value="0" min="0"></td>' +
      '<td><input type="number" id="cut_' + i + '" value="0" min="0"></td>' +
      '<td><input type="number" id="rem_' + i + '" value="0" min="0" style="background:#d8f3dc;font-weight:700;color:#1b4332;"></td>';
    tbody.appendChild(tr);
  });

  var SHEET_URL = 'https://script.google.com/macros/s/AKfycby0tNfxuwJVdq7j9WMXvdBbSXWsu4md7tyBHSkceykHg1xbenltdwTE265lO3jui7A6Xg/exec';

  function sendData() {
    var rows = items.map(function(item, i) {
      return {
        item: item,
        old: document.getElementById('old_' + i).value,
        in: document.getElementById('in_' + i).value,
        cut: document.getElementById('cut_' + i).value,
        rem: document.getElementById('rem_' + i).value
      };
    });
    var note = document.getElementById('noteInput').value;
    var date = document.getElementById('dateDisplay').textContent;
    var btn = document.querySelector('.btn-send');
    btn.disabled = true;
    btn.textContent = 'ชาลิเหง...';

    html2canvas(document.getElementById('captureArea'), {
      scale: 1.5,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false
    }).then(function(canvas) {
      var imageBase64 = canvas.toDateURL�image/jpeg', 0.85).split(',')[1];
      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: date, rows: rows, note: note, imageBase64: imageBase64 })
      }).then(function() {
        alert('ส่งข้อมูลก้อเรฎส่ม! ✅\nบันนุฅ Google Drive แล');
        btn.disabled = false;
        btn.textContent = 'ส่งข้อมูล';
      }).catch(function(err) {
        alert('เทจ่นั: ມ\n' + err.message);
        btn.disabled = false;
        btn.textContent = 'ส่งข้อมูล';
      });
    }).catch(function(err) {
      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: date, rows: rows, note: note })
      }).then(function() {
        alert('ส่งข้อมูล เรฎ! ✅');
        btn.disabled = false;
        btn.textContent = 'ส่งข้อมูล';
      });
    });
  }
</script>
</body>
</html>
